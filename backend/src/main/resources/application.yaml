spring:
  application:
    name: spectra
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spectra}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  quartz:
    job-store-type: memory
    auto-startup: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seed:
    enabled: ${APPLICATION_SEED_ENABLED:true}
  security:
    jwt:
      secret-key: ${JWT_SECRET:V2hhdEEgc2VjdXJlIDMyLWJ5dGUgc2VjcmV0IGZvciBzcGVjdHJhIG5nbw==}
      expiration: ${JWT_EXPIRATION_MS:28800000}

logging:
  level:
    com.dertz.spectra: INFO
